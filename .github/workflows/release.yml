name: Release

on:
  push:
    tags:
      - "v*"

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Trusted Publishing needs npm >= 11.5.1 to mint the OIDC-backed token;
      # the version bundled with actions/setup-node's Node 20 is older.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Build
        run: pnpm build

      # No NPM_TOKEN: each @zeeptech/* package must have a Trusted Publisher
      # configured on npmjs.com (Package Settings -> Trusted Publisher) pointing
      # at this repo + workflow file before this step can succeed. First
      # publish of a brand-new package is done manually (`npm publish`),
      # since trusted publishing can only be attached to a package that
      # already exists on the registry.
      - name: Publish to npm
        run: pnpm release

      - name: Publish to crates.io
        working-directory: src-tauri
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -e
          for crate in zeep-core zeep-logger zeep-updater zeep-ai zeep-kit; do
            output=$(cargo publish -p "$crate" 2>&1) && echo "$output" || {
              echo "$output"
              echo "$output" | grep -qi "already.*upload\|already exists" || exit 1
              echo "$crate already published at this version, skipping"
            }
          done

      - name: Generate changelog from commits
        id: changelog
        run: |
          set -e
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${{ github.ref_name }}$" | head -n 1 || true)
          {
            echo "body<<CHANGELOG_EOF"
            if [ -n "$PREV_TAG" ]; then
              echo "## Commits since $PREV_TAG"
              echo
              git log "$PREV_TAG..${{ github.sha }}" --pretty=format:"- %s (%h)" --no-merges
            else
              echo "## Commits"
              echo
              git log "${{ github.sha }}" --pretty=format:"- %s (%h)" --no-merges
            fi
            echo
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.body }}
