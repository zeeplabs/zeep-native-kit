name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (clippy + test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-features -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test --all-features

  rust-linux:
    name: Rust (Linux clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri build deps + libdbus for keyring's Secret Service backend.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential libssl-dev libgtk-3-dev libdbus-1-dev pkg-config

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-features -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test --all-features

  # keyring's Windows backend (Credential Manager) was never exercised in CI.
  # Scoped to the keychain test binary: it checks the native store is wired
  # (not the mock) and does a real write/read/delete round-trip.
  rust-windows:
    name: Rust (Windows keychain)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Keychain native store test (includes the ignored round-trip)
        working-directory: src-tauri
        run: cargo test -p zeep-core --features keychain --test keychain_native -- --include-ignored

  typescript:
    name: TypeScript (tsc)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @zeeptech/kit imports the other packages' `dist/` output (declared via
      # each package.json's "types" field) — type-check fails on a fresh
      # checkout without building first.
      - name: Build (needed for cross-package type resolution)
        run: pnpm build

      - name: Type check (all packages)
        run: pnpm -r type-check

      - name: Test (all packages)
        run: pnpm -r test

  # The packages declare peer react "^18 || ^19" but develop against 19. Force 18
  # so that claim is actually exercised (types + tests) instead of assumed.
  react18:
    name: React 18 compat (packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Pin React 18 (CI-only, not committed)
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.pnpm = { ...pkg.pnpm, overrides: {
              react: "18", "react-dom": "18", "@types/react": "18", "@types/react-dom": "18",
            } };
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '
          pnpm install --no-frozen-lockfile

      - name: Assert React 18 is what gets tested
        working-directory: packages/@zeeptech/ui
        run: node -e 'const v = require("react/package.json").version; console.log("react", v); if (!v.startsWith("18.")) process.exit(1)'

      - name: Build
        run: pnpm build

      - name: Type check (packages)
        run: pnpm --filter './packages/**' --if-present type-check

      - name: Test (packages)
        run: pnpm --filter './packages/**' test

  build:
    name: Build (macOS)
    needs: [rust, rust-linux, rust-windows, typescript, react18]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-build-

      - name: Build zeep-core
        working-directory: src-tauri
        run: cargo build --all-features
