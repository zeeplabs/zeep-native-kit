[package]
name = "zeep-core"
description = "Core Rust commands for zeep-native-kit: PrefsStore, Keychain, ShellRunner"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = ["prefs", "keychain", "shell"]
prefs = ["dep:serde", "dep:serde_json", "dep:tokio"]
keychain = ["dep:keyring"]
shell = ["dep:tokio", "dep:serde"]

[dependencies]
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
thiserror.workspace = true
tauri.workspace = true

# `keyring` 3 has no default features: without a platform backend it silently
# falls back to an in-memory mock store and secrets vanish when the app exits.
# Enable the native store per target. Cargo merges these into one optional
# dependency, so the `keychain` feature (`dep:keyring`) activates the right one.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", optional = true, features = ["apple-native"] }

[target.'cfg(target_os = "ios")'.dependencies]
keyring = { version = "3", optional = true, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", optional = true, features = ["windows-native"] }

# Linux: Secret Service over D-Bus (persistent; needs a running secret service
# such as gnome-keyring or KWallet) with pure-Rust crypto, no OpenSSL.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", optional = true, features = ["sync-secret-service", "crypto-rust"] }
