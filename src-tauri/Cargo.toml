[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zeepfly/zeep-native-kit"
authors = ["Zeep Tecnologia"]

[workspace.dependencies]
zeep-core = { path = "crates/zeep-core" }
zeep-kit = { path = "crates/zeep-kit" }
zeep-logger = { path = "crates/zeep-logger" }
zeep-updater = { path = "crates/zeep-updater" }
zeep-ai = { path = "crates/zeep-ai" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
fern = "0.7"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
tauri = { version = "2", features = [] }
tauri-plugin = { version = "2", features = ["build"] }
