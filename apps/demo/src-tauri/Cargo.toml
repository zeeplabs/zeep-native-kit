[package]
name = "zeep-demo"
version = "0.1.0"
edition = "2021"

[lib]
name = "zeep_demo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeep-kit = { path = "../../../src-tauri/crates/zeep-kit" }
zeep-logger = { path = "../../../src-tauri/crates/zeep-logger" }
zeep-updater = { path = "../../../src-tauri/crates/zeep-updater" }
# direct dep needed for Tauri build to discover plugin permissions
tauri-plugin-updater = "2"
